    <style>
        body {
            background-color: #2e7d32;
            display: flex;

            margin: 0;
            overflow: hidden;

            text-align: center;
        }

        .logo-splash {
            width: 180px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }
    </style>
