    <script>





        // array para armazenar as respostas corretas
        const respostasCorretas = ["c", "e", "b", "c", "d", "e", "e", "a", "a", "a"];

        function checar() {
            let corretas = 0;

            // loop para percorrer as perguntas
            for (let i = 0; i < respostasCorretas.length; i++) {
                const resposta = document.quiz[`pq${i + 1}`].value;

                if (resposta === respostasCorretas[i]) {
                    corretas++;
                    mudarCorDeFundo(`q${i + 1}${resposta}`, "#99ff99");
                } else {
                    mudarCorDeFundo(`q${i + 1}a`, "#ee4466");
                    mudarCorDeFundo(`q${i + 1}b`, "#ee4466");
                    mudarCorDeFundo(`q${i + 1}c`, "#ee4466");
                    mudarCorDeFundo(`q${i + 1}d`, "#ee4466");
                    mudarCorDeFundo(`q${i + 1}e`, "#ee4466");
                    mudarCorDeFundo(`q${i + 1}${respostasCorretas[i]}`, "#99ff99");
                }
            }

            alert(`Você acertou ${corretas} de ${respostasCorretas.length} perguntas.`);
        }

        // função para mudar a cor de fundo
        function mudarCorDeFundo(elementoId, cor) {
            document.getElementById(elementoId).style.backgroundColor = cor;
        }



        corLenta();
        classEscurecer();
        comentarios();




        var incorrretas = 10 - corretas;
        var mensagem = ["Parabéns!", "Foi bom!", "Melhor tentar novamente!"];
        var imagem = ["../img1.gif", "../img2.gif", "../img3.gif"];
        var pontos;

        if (corretas < 5) {
            pontos = 2;

        }

        if (corretas >= 5 && corretas <= 7) {
            pontos = 1;
        }


        if (corretas >= 7) {
            pontos = 0;

        }



        document.getElementById("numeroCorreto").innerHTML = "Você acertou " + corretas + " e errou " + incorrretas + " do total de questões" + ", ou seja, " + (corretas * 100) / 10 + "%.";
        document.getElementById("mensagem").innerHTML = mensagem[pontos];
        document.getElementById("imagem").src = imagem[pontos];
        document.getElementById("numeroCorreto").style.display = 'block';
        document.getElementById("mensagem").style.display = 'block';
        document.getElementById("imagem").style.display = 'block';










    </script>
